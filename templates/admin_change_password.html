{% extends 'admin_base.html' %}{% set title='Change Password · Hotel 77' %}{% block content %}<div class="mb-8"><p class="text-xs uppercase tracking-[.25em] text-amber-600 font-semibold">Account security</p><h1 class="text-4xl font-serif font-bold mt-2">Change password</h1><p class="text-slate-500 mt-2">Choose a strong password of at least 10 characters.</p></div><form method="POST" class="max-w-xl bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 space-y-5">{% if error %}<div class="rounded-xl bg-red-50 text-red-700 px-4 py-3 text-sm">{{ error }}</div>{% endif %}{% if success %}<div class="rounded-xl bg-green-50 text-green-700 px-4 py-3 text-sm">{{ success }}</div>{% endif %}<label class="block"><span class="text-xs uppercase tracking-wider text-slate-500">Current password</span><input type="password" name="current_password" required autocomplete="current-password" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3"></label><label class="block"><span class="text-xs uppercase tracking-wider text-slate-500">New password</span><input type="password" name="new_password" required minlength="10" autocomplete="new-password" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3"></label><label class="block"><span class="text-xs uppercase tracking-wider text-slate-500">Confirm new password</span><input type="password" name="confirm_password" required minlength="10" autocomplete="new-password" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3"></label><button class="rounded-xl bg-slate-950 text-white px-6 py-3 text-sm font-semibold">Change password</button></form>{% endblock %}
