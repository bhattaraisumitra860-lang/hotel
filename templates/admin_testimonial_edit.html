{% extends 'admin_base.html' %}{% set title='Edit Testimonial · Hotel 77' %}{% block content %}<div class="mb-8"><a href="/admin/testimonials" class="text-xs text-amber-700">← Back to testimonials</a><h1 class="text-4xl font-serif font-bold mt-6">Edit testimonial</h1><p class="text-slate-500 mt-2">Update the guest review and how it appears publicly.</p></div><form method="POST" action="/admin/testimonials/update/{{ item.id }}" class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 space-y-5"><div class="grid md:grid-cols-2 gap-5"><label><span class="text-xs uppercase tracking-wider text-slate-500">Guest name</span><input name="author_name" value="{{ item.author_name }}" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"></label><label><span class="text-xs uppercase tracking-wider text-slate-500">Source</span><input name="source" value="{{ item.source }}" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"></label></div><label class="block"><span class="text-xs uppercase tracking-wider text-slate-500">Review</span><textarea name="content" rows="6" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">{{ item.content }}</textarea></label><label class="block"><span class="text-xs uppercase tracking-wider text-slate-500">Rating (1–5)</span><input name="rating" type="number" min="1" max="5" value="{{ item.rating }}" class="mt-2 w-28 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"></label><label class="text-sm"><input type="checkbox" name="featured" {% if item.featured %}checked{% endif %}> Show this testimonial on the website</label><div class="flex gap-3"><button class="rounded-xl bg-slate-950 text-white px-6 py-3 text-sm font-semibold">Save changes</button><a href="/admin/testimonials" class="rounded-xl border border-slate-200 px-6 py-3 text-sm">Cancel</a></div></form>{% endblock %}
