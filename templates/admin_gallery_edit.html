{% extends 'admin_base.html' %}{% set title='Edit Image · Hotel 77' %}{% block content %}
<div class="mb-8"><a href="/admin/gallery" class="text-xs text-amber-700">← Back to gallery</a><h1 class="text-4xl font-serif font-bold mt-6">Edit image</h1><p class="text-slate-500 mt-2">Replace the image or update its details.</p></div>
<form method="POST" action="/admin/gallery/update/{{ item.id }}" class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 space-y-5">
<img id="image-preview" src="{{ item.url }}" alt="{{ item.caption }}" class="w-full max-h-96 object-contain rounded-2xl bg-slate-100"><p class="text-xs text-slate-400 break-all">Current image: {{ item.url }}</p>
<label class="block"><span class="text-xs uppercase tracking-wider text-slate-500">Replace image</span><div class="flex gap-2 mt-2"><input id="image-url" name="image_url" value="{{ item.url }}" placeholder="Paste image URL" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"><button type="button" onclick="document.getElementById('image-file').click()" class="shrink-0 rounded-xl bg-amber-500 px-4 text-xs font-semibold">Upload</button></div><input id="image-file" type="file" accept="image/*" class="hidden" onchange="replaceImage(event)"><span id="upload-status" class="text-xs text-slate-400">Paste a URL or upload a new image. The replacement is applied when you save.</span></label>
<label class="block"><span class="text-xs uppercase tracking-wider text-slate-500">Title</span><input name="title" value="{{ item.title or item.caption }}" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"></label><label class="block"><span class="text-xs uppercase tracking-wider text-slate-500">Caption</span><input name="caption" value="{{ item.caption }}" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"></label><label class="block"><span class="text-xs uppercase tracking-wider text-slate-500">Alt text</span><input name="alt_text" value="{{ item.alt_text or item.caption }}" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"></label><select name="category" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">{% for cat in ['Exterior','Interior','Rooms','Other'] %}<option {% if item.category == cat %}selected{% endif %}>{{ cat }}</option>{% endfor %}</select><label class="text-sm"><input type="checkbox" name="featured" {% if item.featured %}checked{% endif %}> Featured image</label><div class="flex gap-3"><button class="rounded-xl bg-slate-950 text-white px-6 py-3 text-sm font-semibold">Save changes</button><a href="/admin/gallery" class="rounded-xl border border-slate-200 px-6 py-3 text-sm">Cancel</a></div></form>
<script>async function replaceImage(e){const status=document.getElementById('upload-status');status.textContent='Uploading replacement...';const body=new FormData();body.append('file',e.target.files[0]);const r=await fetch('/admin/upload',{method:'POST',body});const d=await r.json();if(d.success){document.getElementById('image-url').value=d.url;document.getElementById('image-preview').src=d.url;status.textContent='Replacement uploaded. Click Save changes to apply it.';}else{status.textContent=d.error||'Upload failed.';}}</script>
{% endblock %}
